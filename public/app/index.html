<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando para o App...</title>
    <meta http-equiv="refresh" content="0;url=https://app.organizadordepelada.com.br">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0f1a;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #4ade80;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Redirecionando para o app...</p>
        <p><a href="https://app.organizadordepelada.com.br">Clique aqui se não for redirecionado</a></p>
    </div>
    <script>
        window.location.replace('https://app.organizadordepelada.com.br');
    </script>
</body>
</html>
